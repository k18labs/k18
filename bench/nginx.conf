# nginx as k18 is compared with it (bench/README.md): the same page, the same key and
# certificate, TLS 1.3 only with X25519, no session reuse (every connection a full
# handshake, as with k18), both processors, nothing logged.
user www-data;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1048576;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log crit;
events {
    worker_connections 400000;
    multi_accept on;
    accept_mutex off;
}
http {
    access_log off;
    server_tokens off;
    tcp_nodelay on;
    keepalive_timeout 3600s;
    keepalive_requests 1000000000;
    open_file_cache max=100 inactive=1h;
    open_file_cache_valid 1h;
    default_type text/html;
    server {
        listen 80 reuseport backlog=65535;
        listen 443 ssl reuseport backlog=65535;
        ssl_certificate /etc/nginx/k18bench/server.pem;
        ssl_certificate_key /etc/nginx/k18bench/server.key;
        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519;
        ssl_session_tickets off;
        ssl_session_cache off;
        root /var/www/k18bench;
    }
}
