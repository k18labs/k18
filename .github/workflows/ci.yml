name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc make python3 python3-cryptography python3-pip \
            brotli qemu-system-x86 iproute2 iptables libc6-dbg
      - name: Build image
        run: make
      - name: Build fixed IPv4 and IPv6 variants
        run: |
          make B=build-ip CERT=cert IP=192.0.2.15
          make B=build-ip6 CERT=cert IP6=fd00::15
      - name: Run crypto tests
        run: make test
      - name: Check reproducible generated image data
        run: tools/repro.sh
      - name: Fetch independent crypto and TLS test tools
        run: tools/outside.sh fetch
      - name: Run Wycheproof and RFC 6979 vectors
        run: make outside
      - name: Check constant-time behavior with Valgrind
        run: make ct
      - name: Fuzz TLS 1.3 protocol handling
        run: sudo unshare -n -- tools/tlsfuzz.sh
      - name: Check TCP acknowledgement and pipelining cases
        run: sudo unshare -n -- ./tap.sh python3 tools/acktest.py
      - name: Build IPv6 protocol test image
        run: |
          python3 tools/mksite.py build-site6/www 1.5
          make B=build-site6 SITE=build-site6/www IP6=fd00:15::15
      - name: Check IPv6 SYN MSS and packet handling
        run: sudo unshare -n -- env B=build-site6 ./tap.sh python3 tools/v6test.py
      - name: Exercise multi-record site responses
        run: sudo unshare -n -- tools/sitetest.sh tap
      - name: Check Python syntax
        run: python3 -m compileall -q tools test
      - name: Test compressed response selection
        run: python3 test/test_pack.py
      - name: Exercise CLI, certificate, and packaging workflows
        run: tools/k18test.sh
