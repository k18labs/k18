name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc make python3 python3-cryptography
      - name: Build image
        run: make
      - name: Run crypto tests
        run: make test
      - name: Check Python syntax
        run: python3 -m compileall -q tools test
